  <!-- Cookie Consent Banner -->
  <style>
    .cookie-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);

    }
    .cookie-banner.hidden {
      display: none;
    }
    .cookie-btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      border: none;
      padding: 0.5rem 1rem;

      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      margin-left: 1rem;

    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <!-- Cookie Consent Banner -->
  <div id="cookie-banner" class="cookie-banner">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;">
      <p style="margin: 0; flex: 1; min-width: 300px;">
        🍪 Utilizziamo cookie per migliorare la tua esperienza sul nostro sito. 
        <a href="/legal" style="color: #22c55e; text-decoration: underline;">Privacy Policy</a>
      </p>
      <div>
        <button class="cookie-btn" onclick="acceptCookies()">Accetta tutti</button>
        <button class="cookie-btn" style="background: #6b7280;" onclick="acceptNecessary()">Solo necessari</button>
      </div>
    </div>
  </div>

  <script>
    // Cookie Consent Management
    function acceptCookies() {
      localStorage.setItem('cookieConsent', 'all');
      document.getElementById('cookie-banner').classList.add('hidden');
      // Attiva Google Analytics
      gtag('consent', 'update', {
        'analytics_storage': 'granted'
      });
    }

    function acceptNecessary() {
      localStorage.setItem('cookieConsent', 'necessary');
      document.getElementById('cookie-banner').classList.add('hidden');
      // Mantieni Google Analytics disabilitato
      gtag('consent', 'update', {
        'analytics_storage': 'denied'
      });
    }

    // Controlla se l'utente ha già dato il consenso
    if (localStorage.getItem('cookieConsent')) {
      document.getElementById('cookie-banner').classList.add('hidden');
      
      if (localStorage.getItem('cookieConsent') === 'all') {
        gtag('consent', 'update', {
          'analytics_storage': 'granted'
        });
      }
    } else {
      // Default: nega i cookie di tracciamento fino al consenso
      gtag('consent', 'default', {
        'analytics_storage': 'denied'
      });
    }

    // WhatsApp Click Tracking
    window.trackWhatsAppClick = function() {
      if (typeof gtag !== 'undefined') {
        gtag('event', 'whatsapp_click', {
          'event_category': 'engagement',
          'event_label': 'whatsapp_button',
          'value': 1
        });
      }
    };

    // Form Submit Tracking
    window.trackFormSubmit = function(formType) {
      if (typeof gtag !== 'undefined') {
        gtag('event', 'form_submit', {
          'event_category': 'conversion',
          'event_label': formType,
          'value': 1
        });
      }
    };
  </script>

  <script type="module" src="/src/main.tsx"></script>
