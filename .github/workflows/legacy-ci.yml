name: Legacy Site CI

on:
  pull_request:
    paths:
      - 'apps/legacy-web/**'
      - '.github/workflows/legacy-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/legacy-web/**'
      - '.github/workflows/legacy-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/legacy-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/legacy-web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
