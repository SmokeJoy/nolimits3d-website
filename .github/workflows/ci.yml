name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: M-001 verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify toolchain pins
        run: pnpm toolchain:check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm --filter @atlas/web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - name: Codex-native governance
        run: pnpm governance:codex-native

      - name: Secret scan fallback
        run: pnpm secret:scan

      - name: Dependency audit
        run: pnpm dependency:audit

      - name: Scope and private-route guard
        run: pnpm guard:scope

      - name: Migration dry-run guard
        run: pnpm guard:migrations

      - name: Documentation source binding
        run: pnpm guard:source-bindings
